spring.application.name=order-service
server.port=8081

logging.level.com.uv.order_service.outbound.InventoryClient=DEBUG

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

#resilience4j.ratelimiter.instances.inventoryService.limitForPeriod=2
#resilience4j.ratelimiter.instances.inventoryService.limitRefreshPeriod=10s
#resilience4j.ratelimiter.instances.inventoryService.timeoutDuration=11s


# sliding window configuration
resilience4j.circuitbreaker.instances.inventoryServiceCkt.slidingWindowType=COUNT_BASED
# check last 6 calls
resilience4j.circuitbreaker.instances.inventoryServiceCkt.slidingWindowSize=6
# calculate failures after 5 calls
resilience4j.circuitbreaker.instances.inventoryServiceCkt.minimumNumberOfCalls=5

# Failure threshold percentage
resilience4j.circuitbreaker.instances.inventoryServiceCkt.failureRateThreshold=50

# Open state configuration
resilience4j.circuitbreaker.instances.inventoryServiceCkt.waitDurationInOpenState=10s

# Half Open Configuration
resilience4j.circuitbreaker.instances.inventoryServiceCkt.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.inventoryServiceCkt.maxWaitDurationInHalfOpenState=5s
resilience4j.circuitbreaker.instances.inventoryServiceCkt.automaticTransitionFromOpenToHalfOpenEnabled=true


# Resilience4j TimeLimiter Configuration
resilience4j.timelimiter.instances.inventoryServiceTimeLimiter.timeoutDuration=2s
#If time runs out, should I try to stop the task
resilience4j.timelimiter.instances.inventoryServiceTimeLimiter.cancelRunningFuture=true

spring.cloud.openfeign.client.config.inventory-service.connectTimeout=30000
spring.cloud.openfeign.client.config.inventory-service.readTimeout=40000

# Resilience4j Bulkhead Configuration

# Semaphore Bulkhead
#resilience4j.bulkhead.instances.inventoryServiceBulkHead.maxConcurrentCalls=2
#resilience4j.bulkhead.instances.inventoryServiceBulkHead.maxWaitDuration=25s

# for semaphore is synch
# Thread Pool Bulkhead -> Async
resilience4j.thread-pool-bulkhead.instances.inventoryServiceBulkHead.maxThreadPoolSize=3
resilience4j.thread-pool-bulkhead.instances.inventoryServiceBulkHead.coreThreadPoolSize=1
resilience4j.thread-pool-bulkhead.instances.inventoryServiceBulkHead.queueCapacity=0
# output expected 4 request should be immediately rejected

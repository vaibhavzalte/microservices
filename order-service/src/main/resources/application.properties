spring.application.name=order-service
server.port=8081

logging.level.com.uv.order_service.outbound.InventoryClient=DEBUG

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

#resilience4j.ratelimiter.instances.inventoryService.limitForPeriod=2
#resilience4j.ratelimiter.instances.inventoryService.limitRefreshPeriod=10s
#resilience4j.ratelimiter.instances.inventoryService.timeoutDuration=11s


# sliding window configuration
resilience4j.circuitbreaker.instances.inventoryServiceCkt.slidingWindowType=COUNT_BASED
# check last 6 calls
resilience4j.circuitbreaker.instances.inventoryServiceCkt.slidingWindowSize=6
# calculate failures after 5 calls
resilience4j.circuitbreaker.instances.inventoryServiceCkt.minimumNumberOfCalls=5

# Failure threshold percentage
resilience4j.circuitbreaker.instances.inventoryServiceCkt.failureRateThreshold=50

# Open state configuration
resilience4j.circuitbreaker.instances.inventoryServiceCkt.waitDurationInOpenState=10s

# Half Open Configuration
resilience4j.circuitbreaker.instances.inventoryServiceCkt.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.inventoryServiceCkt.maxWaitDurationInHalfOpenState=5s
resilience4j.circuitbreaker.instances.inventoryServiceCkt.automaticTransitionFromOpenToHalfOpenEnabled=true



services:

  rabbitmq:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    restart: unless-stopped


volumes:
  rabbitmq-data:



# start it: docker compose up -d
# check : docker ps
